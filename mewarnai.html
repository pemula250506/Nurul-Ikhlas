<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mewarnai Ajaib - TK Nurul Ikhlas</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #4EA8DE;
            --secondary: #FDC500;
            --success: #70E000;
            --danger: #FF4D6D;
            --bg: #F0F7F7;
            --card: #FFFFFF;
            --text: #2B2D42;
        }

        [data-theme="dark"] {
            --bg: #1A1A2E;
            --card: #16213E;
            --text: #EAEAEA;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        body { background-color: var(--bg); color: var(--text); transition: 0.3s; padding: 20px 5%; overflow-x: hidden; }

        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .back-btn { background: var(--danger); color: white; padding: 10px 20px; border-radius: 20px; text-decoration: none; font-weight: 800; box-shadow: 0 4px 0 rgba(0,0,0,0.1); }
        .title { font-family: 'Fredoka One', cursive; color: var(--primary); font-size: 2rem; text-align: center; flex-grow: 1; }

        .container { display: grid; grid-template-columns: 1.2fr 3fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

        /* Panel Kiri: Pilih Gambar */
        .sidebar { background: var(--card); padding: 15px; border-radius: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); max-height: 600px; overflow-y: auto; }
        .sidebar h3 { font-family: 'Fredoka One', cursive; margin-bottom: 15px; font-size: 1.2rem; color: var(--primary); text-align: center; position: sticky; top: 0; background: var(--card); padding: 5px; z-index: 10; }
        .img-option { width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid #eee; border-radius: 15px; cursor: pointer; transition: 0.2s; background: white; font-size: 0.9rem; font-weight: 800; display: flex; align-items: center; gap: 10px; text-align: left; }
        .img-option:hover { background: #f0fdf4; border-color: var(--success); }
        .img-option.active { border-color: var(--primary); background: #e0f2fe; color: var(--primary); }

        /* Panel Tengah: Area Mewarnai */
        .canvas-area { background: white; border-radius: 30px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 8px solid var(--secondary); min-height: 520px; position: relative; }
        svg { width: 100%; max-width: 450px; height: auto; cursor: crosshair; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.08)); }
        
        /* Selektor elemen SVG agar rapi dan tebal garisnya */
        path, circle, ellipse, polygon, rect { transition: fill 0.2s; fill: #ffffff; stroke: #111111; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
        path:hover, circle:hover, rect:hover, ellipse:hover, polygon:hover { stroke: var(--primary); stroke-width: 5; }

        /* Panel Kanan: Palet Warna */
        .palette { background: var(--card); padding: 20px; border-radius: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center; }
        .color-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .color-circle { width: 45px; height: 45px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .color-circle:hover { transform: scale(1.1); }
        .color-circle.active { border-color: #333; transform: scale(1.15); box-shadow: 0 0 15px rgba(0,0,0,0.2); }

        .controls { margin-top: 20px; display: flex; gap: 10px; }
        .btn-action { padding: 12px 25px; border-radius: 15px; border: none; font-weight: 800; cursor: pointer; color: white; box-shadow: 0 4px 0 rgba(0,0,0,0.1); }
        .btn-reset { background: var(--danger); }
        .btn-reset:active { transform: translateY(3px); box-shadow: none; }

        .instruksi { margin-top: 15px; font-weight: 800; color: var(--primary); text-align: center; }
        
        .sidebar::-webkit-scrollbar { width: 8px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Kembali</a>
        <h1 class="title">🎨 Mewarnai Ajaib</h1>
        <button onclick="toggleTheme()" style="background:none; border:none; cursor:pointer; font-size:1.5rem;">🌓</button>
    </div>

    <div class="container">
        <div class="sidebar">
            <h3>Pilih Gambar</h3>
            <button class="img-option active" onclick="loadGambar('ikan')">🐟 Ikan Mas</button>
            <button class="img-option" onclick="loadGambar('kupu')">🦋 Kupu-Kupu</button>
            <button class="img-option" onclick="loadGambar('apel')">🍎 Apel Merah</button>
            <button class="img-option" onclick="loadGambar('jeruk')">🍊 Jeruk Segar</button>
            <button class="img-option" onclick="loadGambar('mobil')">🚗 Mobil Kecil</button>
            <button class="img-option" onclick="loadGambar('roket')">🚀 Roket Gagah</button>
            <button class="img-option" onclick="loadGambar('rumah')">🏠 Rumahku</button>
        </div>

        <div class="canvas-area">
            <div id="svg-container"></div>
            <p class="instruksi">Klik warna, lalu klik gambarnya! ✨</p>
            <div class="controls">
                <button class="btn-action btn-reset" onclick="resetWarna()"><i class="fa-solid fa-eraser"></i> Bersihkan Semua</button>
            </div>
        </div>

        <div class="palette">
            <h3 style="margin-bottom: 15px;">Warna</h3>
            <div id="color-list" class="color-grid"></div>
            <hr style="width: 100%; margin: 15px 0; border: 1px solid #eee;">
            <p style="font-size: 0.8rem; margin-bottom: 5px; font-weight: bold;">Pilih Sendiri:</p>
            <input type="color" id="custom-color" style="width: 50px; height: 50px; border: none; background: none; cursor: pointer;">
        </div>
    </div>

    <script>
        let warnaSekarang = '#FF4D6D';
        
        // DATABASE GAMBAR SVG (Sudah dikurangi Kura-Kura, Pisang, & Pesawat)
        const svgs = {
            ikan: `<svg viewBox="0 0 200 200">
                <path d="M180,100 C150,60 110,50 60,65 L20,35 L40,100 L20,165 L60,135 C110,150 150,140 180,100 Z" onclick="warnai(event)"/>
                <path d="M140,58 C120,30 90,35 80,45 Z" onclick="warnai(event)"/>
                <path d="M120,140 C110,165 80,165 70,152 Z" onclick="warnai(event)"/>
                <path d="M140,65 C130,85 130,115 140,135" fill="none" stroke="#111" stroke-width="3"/>
                <circle cx="155" cy="85" r="7" fill="#111"/>
            </svg>`,
            
            kupu: `<svg viewBox="0 0 200 200">
                <path d="M100,90 C110,40 175,20 175,65 C175,95 130,105 100,100 Z" onclick="warnai(event)"/>
                <path d="M100,90 C89,40 25,20 25,65 C25,95 70,105 100,100 Z" onclick="warnai(event)"/>
                <path d="M100,100 C120,110 165,150 150,175 C130,195 110,140 100,120 Z" onclick="warnai(event)"/>
                <path d="M100,100 C80,110 35,150 50,175 C70,195 90,140 100,120 Z" onclick="warnai(event)"/>
                <rect x="94" y="45" width="12" height="115" rx="6" onclick="warnai(event)"/>
                <circle cx="140" cy="60" r="10" onclick="warnai(event)"/>
                <circle cx="60" cy="60" r="10" onclick="warnai(event)"/>
                <path d="M95,45 Q80,20 65,25 M105,45 Q120,20 135,25" fill="none" stroke="#111" stroke-width="3"/>
            </svg>`,
            
            apel: `<svg viewBox="0 0 200 200">
                <path d="M100,165 C70,165 35,145 35,95 C35,55 70,40 100,55 C130,40 165,55 165,95 C165,145 130,165 100,165 Z" onclick="warnai(event)"/>
                <path d="M100,55 Q105,25 115,20" fill="none" stroke="#111" stroke-width="4"/>
                <path d="M108,35 Q135,25 145,40 Q125,50 108,35 Z" onclick="warnai(event)"/>
            </svg>`,
            
            jeruk: `<svg viewBox="0 0 200 200">
                <circle cx="100" cy="110" r="65" onclick="warnai(event)"/>
                <path d="M100,45 L100,25" fill="none" stroke="#111" stroke-width="4"/>
                <path d="M100,35 Q75,20 65,35 Q85,45 100,35 Z" onclick="warnai(event)"/>
                <circle cx="100" cy="110" r="50" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="8,8"/>
            </svg>`,
            
            mobil: `<svg viewBox="0 0 200 200">
                <path d="M20,135 L180,135 L175,95 L135,85 L115,45 L55,45 L35,95 Z" onclick="warnai(event)"/>
                <rect x="60" y="55" width="22" height="25" onclick="warnai(event)"/>
                <path d="M90,55 L110,55 L125,80 L90,80 Z" onclick="warnai(event)"/>
                <circle cx="60" cy="135" r="20" onclick="warnai(event)"/>
                <circle cx="60" cy="135" r="8" fill="#111"/>
                <circle cx="140" cy="135" r="20" onclick="warnai(event)"/>
                <circle cx="140" cy="135" r="8" fill="#111"/>
                <rect x="165" y="105" width="15" height="10" rx="3" onclick="warnai(event)"/>
            </svg>`,
            
            roket: `<svg viewBox="0 0 200 200">
                <path d="M100,20 C125,55 130,100 130,140 L70,140 C70,100 75,55 100,20 Z" onclick="warnai(event)"/>
                <path d="M70,110 L35,150 L70,140 Z" onclick="warnai(event)"/>
                <path d="M130,110 L165,150 L130,140 Z" onclick="warnai(event)"/>
                <circle cx="100" cy="70" r="14" onclick="warnai(event)"/>
                <circle cx="100" cy="110" r="10" onclick="warnai(event)"/>
                <polygon points="80,140 70,175 100,155 130,175 120,140" onclick="warnai(event)"/>
            </svg>`,
            
            rumah: `<svg viewBox="0 0 200 200">
                <rect x="45" y="100" width="110" height="75" onclick="warnai(event)"/>
                <polygon points="30,100 100,35 170,100" onclick="warnai(event)"/>
                <rect x="88" y="135" width="25" height="40" onclick="warnai(event)"/>
                <rect x="58" y="115" width="22" height="22" onclick="warnai(event)"/>
                <rect x="120" y="115" width="22" height="22" onclick="warnai(event)"/>
                <circle cx="100" cy="65" r="10" onclick="warnai(event)"/>
            </svg>`
        };

        const colors = [
            '#FF4D6D', '#FF7043', '#FDC500', '#FFEB3B', 
            '#70E000', '#4CAF50', '#4EA8DE', '#2196F3', 
            '#9D4EDD', '#E91E63', '#795548', '#000000', 
            '#FFFFFF', '#8D99AE'
        ];

        // Buat Palet Warna secara otomatis
        const colorList = document.getElementById('color-list');
        colors.forEach((color, index) => {
            const div = document.createElement('div');
            div.className = `color-circle ${index === 0 ? 'active' : ''}`;
            div.style.backgroundColor = color;
            div.onclick = () => {
                document.querySelectorAll('.color-circle').forEach(c => c.classList.remove('active'));
                div.classList.add('active');
                warnaSekarang = color;
            };
            colorList.appendChild(div);
        });

        // Input warna custom sendiri
        document.getElementById('custom-color').oninput = (e) => {
            warnaSekarang = e.target.value;
            document.querySelectorAll('.color-circle').forEach(c => c.classList.remove('active'));
        };

        function loadGambar(key) {
            document.getElementById('svg-container').innerHTML = svgs[key];
            document.querySelectorAll('.img-option').forEach(btn => {
                btn.classList.remove('active');
                if(btn.getAttribute('onclick').includes(key)) btn.classList.add('active');
            });
        }

        function warnai(event) {
            event.target.style.fill = warnaSekarang;
            event.stopPropagation();
        }

        function resetWarna() {
            const elements = document.querySelectorAll('#svg-container path, #svg-container circle, #svg-container rect, #svg-container ellipse, #svg-container polygon');
            elements.forEach(el => {
                el.style.fill = '#ffffff';
            });
        }

        function toggleTheme() {
            const body = document.body;
            const theme = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', theme);
            localStorage.setItem('tk_theme', theme);
        }

        window.onload = () => {
            const savedTheme = localStorage.getItem('tk_theme');
            if (savedTheme) document.body.setAttribute('data-theme', savedTheme);
            loadGambar('ikan');
        };
    </script>
</body>
</html>
