<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK Nurul Ikhlas - Beranda</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4A90E2;
            --pink: #FF85A1;
            --green: #6BCB77;
            --purple: #A66CFF;
            --yellow: #FFD93D;
            --bg: #F0F9FF;
            --text: #2C3E50;
        }

        * { 
            box-sizing: border-box; 
            font-family: 'Quicksand', sans-serif; 
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* HEADER UI */
        header {
            background: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-bottom: 5px solid var(--yellow);
        }

        .brand { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }
        
        .logo-ui { 
            width: 50px; height: 50px; background: var(--bg); 
            border-radius: 50%; display: flex; justify-content: center; 
            align-items: center; font-size: 24px; border: 2px solid var(--pink);
        }

        .brand h1 { 
            font-family: 'Fredoka', sans-serif; 
            font-size: 1.6rem; 
            color: var(--primary); 
            margin: 0; 
        }

        /* NAVIGASI ATAS */
        .nav-tabs { display: flex; gap: 8px; }
        .tab-btn {
            padding: 10px 18px; border: none; border-radius: 12px;
            background: transparent; font-weight: 700; text-decoration: none;
            color: var(--text); font-size: 0.9rem; transition: 0.3s;
        }
        .tab-btn.active { background: var(--primary); color: white; }
        .tab-btn:hover:not(.active) { background: rgba(0,0,0,0.05); }

        /* KONTEN UTAMA */
        main { 
            flex: 1; 
            padding: 40px 20px; 
            max-width: 1000px; 
            margin: 0 auto; 
            width: 100%; 
        }
        
        .hero { 
            text-align: center; 
            margin-bottom: 40px; 
        }
        
        .hero h2 { 
            font-family: 'Fredoka', sans-serif; 
            font-size: 2.2rem; 
            color: var(--text); 
            margin: 0 0 10px 0;
        }

        .hero p { font-size: 1.2rem; color: #7F8C8D; font-weight: 500; margin: 0; }

        /* GRID MENU BERANDA */
        .menu-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 25px; 
        }

        .menu-card {
            background: white; 
            padding: 40px 20px; 
            border-radius: 24px; 
            text-align: center;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border-bottom: 8px solid #ddd;
            box-shadow: 0 8px 16px rgba(0,0,0,0.02);
        }

        .menu-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 15px 30px rgba(0,0,0,0.08); 
        }

        .menu-card .icon { font-size: 60px; margin-bottom: 15px; display: block; }
        
        .menu-card h3 { 
            margin: 0; 
            font-size: 1.3rem; 
            font-family: 'Fredoka', sans-serif; 
            color: var(--text);
        }

        /* WARNA KHUSUS PER CARD MENU */
        .c-baca { border-color: var(--pink); }
        .c-angka { border-color: var(--green); }
        .c-gambar { border-color: var(--purple); }
        .c-profil { border-color: var(--yellow); }

        /* FOOTER */
        footer { 
            text-align: center; 
            padding: 25px; 
            color: #94A3B8; 
            font-size: 0.9rem; 
            font-weight: 500; 
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="logo-ui">🏫</div>
            <h1>TK Nurul Ikhlas</h1>
        </div>
        <nav class="nav-tabs">
            <a href="index.html" class="tab-btn active">Beranda</a>
            <a href="membaca.html" class="tab-btn">Membaca</a>
            <a href="menghitung.html" class="tab-btn">Angka</a>
            <a href="kreatif.html" class="tab-btn">Kreatif</a>
            <a href="profil.html" class="tab-btn">Profil</a>
        </nav>
    </header>

    <main>
        <div class="hero">
            <h2>Selamat Datang, Sobat Pintar! 👋</h2>
            <p>Mulai petualangan belajar seru hari ini dengan senyuman!</p>
        </div>

        <div class="menu-grid">
            <a href="membaca.html" class="menu-card c-baca">
                <span class="icon">📖</span>
                <h3>BELAJAR BACA</h3>
            </a>
            <a href="menghitung.html" class="menu-card c-angka">
                <span class="icon">🔢</span>
                <h3>MENGENAL ANGKA</h3>
            </a>
            <a href="kreatif.html" class="menu-card c-gambar">
                <span class="icon">🎨</span>
                <h3>PAPAN KREATIF</h3>
            </a>
            <a href="profil.html" class="menu-card c-profil">
                <span class="icon">👤</span>
                <h3>PROFIL PINTAR</h3>
            </a>
        </div>
    </main>

    <footer>© 2026 TK Nurul Ikhlas - Platform Pembelajaran Modern Anak</footer>

</body>
</html>
