<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK Nurul Ikhlas - Panel Belajar Interaktif</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #4EA8DE;
            --secondary: #FDC500;
            --success: #70E000;
            --danger: #FF4D6D;
            --bg: #F0F7F7;
            --card: #FFFFFF;
            --text: #2B2D42;
            --placeholder-bg: #E2E8F0;
        }

        [data-theme="dark"] {
            --bg: #1A1A2E;
            --card: #16213E;
            --text: #EAEAEA;
            --placeholder-bg: #2C3A5F;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            transition: 0.3s;
        }

        /* --- NAVIGATION --- */
        nav {
            background: var(--card);
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-wrapper {
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-container-box {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            border: 2px dashed var(--primary);
            background: var(--placeholder-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: 0.2s;
        }

        .logo-container-box:hover {
            border-style: solid;
            background: #fff;
        }

        .logo-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; 
        }

        .logo-placeholder-icon {
            font-size: 1.8rem;
            color: var(--primary);
        }

        .upload-hint {
            font-size: 0.6rem;
            font-weight: 800;
            color: var(--primary);
            margin-top: 3px;
            text-transform: uppercase;
        }

        .brand-name {
            font-family: 'Fredoka One', cursive;
            font-size: 1.8rem;
            color: var(--primary);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-theme {
            background: #eee;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        /* --- MAIN LAYOUT --- */
        .main-wrapper {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            padding: 30px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* --- SIDEBAR INFO --- */
        .info-sidebar {
            background: var(--card);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            height: fit-content;
        }

        .info-sidebar h2 {
            font-family: 'Fredoka One', cursive;
            color: var(--primary);
            font-size: 1.4rem;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 10px;
        }

        .info-list {
            list-style: none;
        }

        .info-list li {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .info-list i {
            color: var(--secondary);
            margin-top: 3px;
        }

        /* --- DASHBOARD AREA --- */
        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .banner {
            background: linear-gradient(135deg, var(--primary), #00D2FF);
            padding: 50px;
            border-radius: 40px;
            color: white;
            text-align: center;
            box-shadow: 0 15px 30px rgba(78,168,222,0.3);
        }

        .banner h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.8rem;
            margin-bottom: 10px;
        }

        .banner p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        /* --- MENU GRID --- */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .menu-item {
            background: var(--card);
            padding: 40px 20px;
            border-radius: 30px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            border-bottom: 6px solid transparent;
        }

        .menu-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.08);
        }

        .menu-item i {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }

        .menu-item h3 {
            font-family: 'Fredoka One', cursive;
            font-size: 1.3rem;
        }

        input[type="file"] { display: none; }

        @media (max-width: 900px) {
            .main-wrapper { grid-template-columns: 1fr; }
            .info-sidebar { order: 2; }
            .dashboard { order: 1; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo-area">
            <div class="logo-wrapper" title="Klik untuk ganti logo TK">
                <label for="logo-upload" class="logo-container-box">
                    <i class="fa-solid fa-mosque logo-placeholder-icon" id="logo-icon"></i>
                    <img src="" id="display-logo" class="logo-preview" alt="Logo TK">
                </label>
                <span class="upload-hint">Ganti Logo</span>
            </div>
            <input type="file" id="logo-upload" accept="image/*" onchange="handleLogo(this)">
            <span class="brand-name">TK Nurul Ikhlas</span>
        </div>

        <div class="nav-right">
            <button class="btn-theme" onclick="toggleTheme()" title="Ganti Mode">🌙</button>
        </div>
    </nav>

    <div class="main-wrapper">
        <aside class="info-sidebar">
            <h2>Tentang Kami</h2>
            <ul class="info-list">
                <li>
                    <i class="fa-solid fa-location-dot"></i>
                    <span>Jl. Pendidikan No. 12, Kota Nurul Ikhlas</span>
                </li>
                <li>
                    <i class="fa-solid fa-phone"></i>
                    <span>(021) 123-4567</span>
                </li>
                <li>
                    <i class="fa-solid fa-heart"></i>
                    <span>Mendidik dengan kasih sayang dan nilai islami.</span>
                </li>
            </ul>
            <div style="margin-top: 25px; padding: 15px; background: var(--bg); border-radius: 20px; text-align: center;">
                <p style="font-weight: 800; color: var(--primary); font-size: 0.8rem;">TAHUN AJARAN 2024/2025</p>
            </div>
        </aside>

        <main class="dashboard">
            <section class="banner">
                <h1>Selamat Datang!</h1>
                <p>Ayo belajar bersama di TK Nurul Ikhlas</p>
            </section>

            <div class="menu-grid">
                <div class="menu-item" style="border-color: var(--primary);">
                    <i class="fa-solid fa-font" style="color: var(--primary);"></i>
                    <h3>Huruf A-Z</h3>
                </div>
                <div class="menu-item" style="border-color: var(--secondary);">
                    <i class="fa-solid fa-calculator" style="color: var(--secondary);"></i>
                    <h3>Angka & Hitung</h3>
                </div>
                <div class="menu-item" style="border-color: var(--success);">
                    <i class="fa-solid fa-book-open-reader" style="color: var(--success);"></i>
                    <h3>Membaca</h3>
                </div>
                <div class="menu-item" style="border-color: var(--danger);">
                    <i class="fa-solid fa-palette" style="color: var(--danger);"></i>
                    <h3>Kreativitas</h3>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- LOGIKA UPLOAD LOGO TK ---
        function handleLogo(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgElement = document.getElementById('display-logo');
                    const iconElement = document.getElementById('logo-icon');
                    
                    imgElement.src = e.target.result;
                    imgElement.style.display = 'block';
                    iconElement.style.display = 'none';
                    
                    localStorage.setItem('nurul_ikhlas_logo', e.target.result);
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // --- DARK MODE TOGGLE ---
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            const isDark = currentTheme === 'dark';
            body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('nurul_ikhlas_theme', isDark ? 'light' : 'dark');
        }

        // --- LOAD DATA SAAT REFRESH ---
        window.onload = () => {
            const savedLogo = localStorage.getItem('nurul_ikhlas_logo');
            const savedTheme = localStorage.getItem('nurul_ikhlas_theme');

            if (savedLogo) {
                const imgElement = document.getElementById('display-logo');
                imgElement.src = savedLogo;
                imgElement.style.display = 'block';
                document.getElementById('logo-icon').style.display = 'none';
            }
            
            if (savedTheme) {
                document.body.setAttribute('data-theme', savedTheme);
            }
        };
    </script>
</body>
</html>
