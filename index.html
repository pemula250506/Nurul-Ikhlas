<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pintar Ceria - Panel Belajar Interaktif</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #4EA8DE;
            --secondary: #FDC500;
            --success: #70E000;
            --danger: #FF4D6D;
            --bg: #F0F7F7;
            --card: #FFFFFF;
            --text: #2B2D42;
        }

        [data-theme="dark"] {
            --bg: #1A1A2E;
            --card: #16213E;
            --text: #EAEAEA;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            transition: 0.3s;
        }

        /* --- NAVIGATION --- */
        nav {
            background: var(--card);
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-preview {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid var(--primary);
            background: #f0f0f0;
            cursor: pointer;
        }

        .brand-name {
            font-family: 'Fredoka One', cursive;
            font-size: 1.8rem;
            color: var(--primary);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-mini-photo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--secondary);
        }

        /* --- MAIN LAYOUT --- */
        .main-wrapper {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
            padding: 30px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* --- SIDEBAR PROFIL --- */
        .profile-card {
            background: var(--card);
            padding: 30px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            height: fit-content;
        }

        .photo-upload-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
        }

        #profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid var(--secondary);
        }

        .upload-circle {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: var(--primary);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 3px solid var(--card);
        }

        .input-name {
            width: 100%;
            padding: 12px;
            border: 2px solid #E0E0E0;
            border-radius: 15px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 20px;
            background: transparent;
            color: var(--text);
        }

        .input-name:focus {
            border-color: var(--primary);
            outline: none;
        }

        /* --- DASHBOARD AREA --- */
        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .banner {
            background: linear-gradient(135deg, var(--primary), #00D2FF);
            padding: 40px;
            border-radius: 30px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .banner h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        /* --- MENU GRID --- */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .menu-item {
            background: var(--card);
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            border-bottom: 5px solid transparent;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
        }

        .menu-item:hover {
            transform: translateY(-8px);
        }

        .menu-item i {
            font-size: 3.5rem;
            margin-bottom: 15px;
            display: block;
        }

        .btn-theme {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--text);
        }

        input[type="file"] { display: none; }

        @media (max-width: 900px) {
            .main-wrapper { grid-template-columns: 1fr; }
            .profile-card { margin: 0 auto; width: 100%; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo-area">
            <label for="logo-upload">
                <img src="https://via.placeholder.com/100?text=LOGO" id="display-logo" class="logo-preview" alt="Logo TK">
            </label>
            <input type="file" id="logo-upload" accept="image/*" onchange="handleLogo(this)">
            <span class="brand-name">Pintar Ceria</span>
        </div>

        <div class="nav-right">
            <button class="btn-theme" onclick="toggleTheme()">🌙</button>
            <img src="https://via.placeholder.com/100?text=USER" id="nav-user-img" class="user-mini-photo" alt="Profil">
        </div>
    </nav>

    <div class="main-wrapper">
        <aside class="profile-card">
            <div class="photo-upload-container">
                <img src="https://via.placeholder.com/150?text=FOTO" id="profile-img" alt="Foto Siswa">
                <label for="photo-upload" class="upload-circle">
                    <i class="fa-solid fa-camera"></i>
                </label>
                <input type="file" id="photo-upload" accept="image/*" onchange="handleProfilePhoto(this)">
            </div>

            <input type="text" id="user-name" class="input-name" placeholder="Masukkan Nama Siswa" oninput="saveName(this.value)">
            
            <div style="text-align: left; margin-top: 20px;">
                <p style="font-weight: 800; font-size: 0.9rem; margin-bottom: 5px;">Progress Belajar</p>
                <div style="background: #eee; height: 10px; border-radius: 5px;">
                    <div style="background: var(--success); width: 65%; height: 100%; border-radius: 5px;"></div>
                </div>
            </div>
        </aside>

        <main class="dashboard">
            <section class="banner">
                <h1 id="greeting">Selamat Datang!</h1>
                <p>Hari ini kita mau belajar apa? Pilih menu di bawah ya!</p>
            </section>

            <div class="menu-grid">
                <div class="menu-item" style="border-color: var(--primary);">
                    <i class="fa-solid fa-font" style="color: var(--primary);"></i>
                    <h3>Huruf A-Z</h3>
                </div>
                <div class="menu-item" style="border-color: var(--secondary);">
                    <i class="fa-solid fa-arrow-up-9-1" style="color: var(--secondary);"></i>
                    <h3>Angka 1-100</h3>
                </div>
                <div class="menu-item" style="border-color: var(--success);">
                    <i class="fa-solid fa-book-open" style="color: var(--success);"></i>
                    <h3>Membaca</h3>
                </div>
                <div class="menu-item" style="border-color: var(--danger);">
                    <i class="fa-solid fa-pencil" style="color: var(--danger);"></i>
                    <h3>Menulis</h3>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- LOGIKA UPLOAD LOGO TK ---
        function handleLogo(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('display-logo').src = e.target.result;
                    localStorage.setItem('pc_logo', e.target.result);
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // --- LOGIKA UPLOAD FOTO PROFIL SISWA ---
        function handleProfilePhoto(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('profile-img').src = e.target.result;
                    document.getElementById('nav-user-img').src = e.target.result;
                    localStorage.setItem('pc_user_photo', e.target.result);
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // --- SIMPAN NAMA SISWA ---
        function saveName(name) {
            document.getElementById('greeting').innerText = name ? `Halo, ${name}!` : "Selamat Datang!";
            localStorage.setItem('pc_user_name', name);
        }

        // --- DARK MODE TOGGLE ---
        function toggleTheme() {
            const body = document.body;
            const isDark = body.getAttribute('data-theme') === 'dark';
            body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('pc_theme', isDark ? 'light' : 'dark');
        }

        // --- LOAD DATA SAAT REFRESH ---
        window.onload = () => {
            const savedLogo = localStorage.getItem('pc_logo');
            const savedPhoto = localStorage.getItem('pc_user_photo');
            const savedName = localStorage.getItem('pc_user_name');
            const savedTheme = localStorage.getItem('pc_theme');

            if (savedLogo) document.getElementById('display-logo').src = savedLogo;
            if (savedPhoto) {
                document.getElementById('profile-img').src = savedPhoto;
                document.getElementById('nav-user-img').src = savedPhoto;
            }
            if (savedName) {
                document.getElementById('user-name').value = savedName;
                document.getElementById('greeting').innerText = `Halo, ${savedName}!`;
            }
            if (savedTheme) document.body.setAttribute('data-theme', savedTheme);
        };
    </script>
</body>
</html>
