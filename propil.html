<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK Nurul Ikhlas - Profil Pintar</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4A90E2;
            --yellow: #FFD93D;
            --pink: #FF85A1;
            --bg: #FFF9E6; /* Kuning sangat muda lembut */
            --text: #2C3E50;
        }

        * { box-sizing: border-box; font-family: 'Quicksand', sans-serif; }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-bottom: 5px solid var(--yellow);
        }

        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-ui { width: 40px; height: 40px; background: #FFF9E6; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 2px solid var(--yellow); font-size: 20px; }
        .brand h1 { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; color: var(--primary); margin: 0; }

        .nav-tabs { display: flex; gap: 8px; }
        .tab-btn { padding: 10px 18px; border: none; border-radius: 12px; background: transparent; font-weight: 700; text-decoration: none; color: var(--text); font-size: 0.9rem; }
        .tab-btn.active { background: var(--yellow); color: #856404; }

        main { flex: 1; padding: 40px 20px; max-width: 600px; margin: 0 auto; width: 100%; }

        .profile-card {
            background: white;
            border-radius: 35px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            position: relative;
            border: 4px solid white;
        }

        .profile-card::before {
            content: "";
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 40px;
            border: 3px dashed var(--yellow);
            z-index: -1;
        }

        .avatar-circle {
            width: 120px;
            height: 120px;
            background: var(--bg);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            border: 5px solid var(--yellow);
        }

        .user-name {
            font-family: 'Fredoka', sans-serif;
            font-size: 2rem;
            color: var(--primary);
            margin: 0 0 10px 0;
        }

        .info-grid {
            text-align: left;
            margin-top: 30px;
            background: #FAFAFA;
            padding: 20px;
            border-radius: 20px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #EEE;
        }

        .info-item:last-child { border-bottom: none; }

        .label { font-weight: 700; color: #7F8C8D; }
        .value { font-weight: 700; color: var(--text); }

        .badge-container {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .badge {
            background: #FFEAF0;
            color: var(--pink);
            padding: 8px 15px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: 700;
        }

        footer { text-align: center; padding: 25px; color: #94A3B8; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="brand">
            <div class="logo-ui">🏫</div>
            <h1>TK Nurul Ikhlas</h1>
        </a>
        <nav class="nav-tabs">
            <a href="index.html" class="tab-btn">Beranda</a>
            <a href="membaca.html" class="tab-btn">Membaca</a>
            <a href="menghitung.html" class="tab-btn">Angka</a>
            <a href="kreatif.html" class="tab-btn">Kreatif</a>
            <a href="profil.html" class="tab-btn active">Profil</a>
        </nav>
    </header>

    <main>
        <div class="profile-card">
            <div class="avatar-circle">👦</div>
            <h2 class="user-name">Sobat Pintar</h2>
            <p style="color: #7F8C8D; font-weight: 500;">Siswa Aktif TK Nurul Ikhlas</p>

            <div class="badge-container">
                <span class="badge">🔥 Rajin Belajar</span>
                <span class="badge">🌟 Penolong</span>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <span class="label">Sekolah</span>
                    <span class="value">TK Nurul Ikhlas</span>
                </div>
                <div class="info-item">
                    <span class="label">Tahun Ajaran</span>
                    <span class="value">2026/2027</span>
                </div>
                <div class="info-item">
                    <span class="label">Total Bintang</span>
                    <span class="value" style="color: #F39C12;">⭐ 45 Bintang</span>
                </div>
                <div class="info-item">
                    <span class="label">Status Akun</span>
                    <span class="value" style="color: var(--green);">Sangat Baik</span>
                </div>
            </div>
        </div>
    </main>

    <footer>© 2026 TK Nurul Ikhlas - Platform Digital Anak</footer>

</body>
</html>
