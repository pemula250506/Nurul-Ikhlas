<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Angka & Berhitung - TK Nurul Ikhlas</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #4EA8DE;
            --secondary: #FDC500;
            --success: #70E000;
            --danger: #FF4D6D;
            --purple: #9D4EDD;
            --bg: #F0F7F7;
            --card: #FFFFFF;
            --text: #2B2D42;
        }

        [data-theme="dark"] {
            --bg: #1A1A2E;
            --card: #16213E;
            --text: #EAEAEA;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        body { background-color: var(--bg); color: var(--text); transition: 0.3s; padding: 20px 5%; }

        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; }
        .back-btn { background: var(--danger); color: white; padding: 10px 20px; border-radius: 20px; text-decoration: none; font-weight: 800; box-shadow: 0 4px 0 rgba(0,0,0,0.1); transition: 0.2s; }
        .title { font-family: 'Fredoka One', cursive; color: var(--success); font-size: 2rem; text-align: center; flex-grow: 1; }

        .main-container { display: flex; flex-direction: column; gap: 40px; }
        .belajar-box { display: grid; grid-template-columns: 1fr 2fr; gap: 30px; }
        @media (max-width: 768px) { .belajar-box { grid-template-columns: 1fr; } }

        /* Grid Angka */
        .number-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-height: 420px; overflow-y: auto; padding-right: 5px; }
        .number-grid::-webkit-scrollbar { width: 6px; }
        .number-grid::-webkit-scrollbar-thumb { background: var(--success); border-radius: 10px; }

        .num-btn { background: var(--card); border: 2px solid #e2e8f0; font-family: 'Fredoka One', cursive; font-size: 1.8rem; padding: 12px 0; border-radius: 15px; cursor: pointer; color: var(--text); transition: 0.2s; box-shadow: 0 4px 0 #e2e8f0; }
        .num-btn.active { background: var(--success); color: white; border-color: var(--success); box-shadow: 0 4px 0 #52a300; transform: translateY(2px); }

        /* Tampilan Utama Angka */
        .display-card { background: var(--card); border-radius: 30px; padding: 30px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center; min-height: 420px; cursor: pointer; justify-content: center; }
        .big-number { font-family: 'Fredoka One', cursive; font-size: 6rem; color: var(--success); margin-bottom: 5px; }
        .number-name { font-family: 'Fredoka One', cursive; font-size: 2.5rem; color: var(--text); }
        .count-display { font-size: 2rem; margin: 15px 0; min-height: 80px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px; max-width: 90%; }
        .suara-instruksi { font-size: 0.9rem; color: var(--success); font-weight: bold; }

        /* Area Game Berhitung */
        .game-card { background: var(--card); border-radius: 30px; padding: 40px 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .game-title { font-family: 'Fredoka One', cursive; color: var(--purple); font-size: 2rem; margin-bottom: 25px; }
        
        .math-box { display: flex; align-items: center; justify-content: center; gap: 20px; font-family: 'Fredoka One', cursive; font-size: 3.5rem; margin-bottom: 20px; flex-wrap: wrap; }
        .math-item { display: flex; flex-direction: column; align-items: center; min-width: 80px; }
        .math-emoji { font-size: 1.5rem; min-height: 50px; max-width: 150px; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; margin-top: 10px; font-family: sans-serif; }
        
        .operator { color: var(--primary); }
        .sama-dengan { color: var(--text); }
        
        .input-jawaban { width: 120px; height: 80px; font-family: 'Fredoka One', cursive; font-size: 3rem; text-align: center; border: 4px dashed var(--purple); border-radius: 20px; background: var(--bg); color: var(--purple); outline: none; }
        
        .btn-cek { background: var(--purple); color: white; border: none; font-family: 'Fredoka One', cursive; padding: 15px 40px; font-size: 1.5rem; border-radius: 20px; cursor: pointer; box-shadow: 0 5px 0 #7b2cbf; transition: 0.2s; margin-top: 10px; }
        .btn-cek:active { transform: translateY(3px); box-shadow: 0 2px 0 #7b2cbf; }
        
        .feedback { font-family: 'Fredoka One', cursive; font-size: 1.8rem; margin-top: 20px; min-height: 40px; }
        .feedback.benar { color: var(--success); }
        .feedback.salah { color: var(--danger); }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Kembali</a>
        <h1 class="title">🔢 Belajar Angka & Berhitung</h1>
        <button onclick="toggleTheme()" style="background:none; border:none; cursor:pointer; font-size:1.5rem;">🌓</button>
    </div>

    <div class="main-container">
        <div class="belajar-box">
            <div class="number-grid" id="number-box"></div>

            <div class="display-card" onclick="suaraAngka()">
                <div class="big-number" id="view-number">1</div>
                <div class="number-name" id="view-name">Satu</div>
                <div class="count-display" id="view-count">🎈</div>
                <div class="suara-instruksi"><i class="fa-solid fa-volume-high"></i> Klik kartu untuk suara</div>
            </div>
        </div>

        <div class="game-card">
            <h2 class="game-title">✨ Ayo Bermain Berhitung! ✨</h2>
            
            <div class="math-box">
                <div class="math-item">
                    <span id="num1">3</span>
                    <div class="math-emoji" id="emoji1">🍎🍎🍎</div>
                </div>
                
                <span class="operator" id="math-op">+</span>
                
                <div class="math-item">
                    <span id="num2">2</span>
                    <div class="math-emoji" id="emoji2">🍎🍎</div>
                </div>
                
                <span class="sama-dengan">=</span>
                
                <input type="number" class="input-jawaban" id="jawaban-user" placeholder="?" min="0" max="40">
            </div>

            <button class="btn-cek" onclick="cekJawaban()">Periksa Jawaban 🧐</button>
            <div class="feedback" id="game-feedback"></div>
        </div>
    </div>

    <script>
        // Database Angka 1-20
        const databaseAngka = {
            1: { nama: 'Satu', emoji: '🎈' }, 2: { nama: 'Dua', emoji: '🚗' }, 3: { nama: 'Tiga', emoji: '🍎' },
            4: { nama: 'Empat', emoji: '🐱' }, 5: { nama: 'Lima', emoji: '⭐' }, 6: { nama: 'Enam', emoji: '🐠' },
            7: { nama: 'Tujuh', emoji: '🍓' }, 8: { nama: 'Delapan', emoji: '🦋' }, 9: { nama: 'Sembilan', emoji: '🍦' },
            10: { nama: 'Sepuluh', emoji: '⚽' }, 11: { nama: 'Sebelas', emoji: '🚀' }, 12: { nama: 'Dua Belas', emoji: '🍒' },
            13: { nama: 'Tiga Belas', emoji: '🍩' }, 14: { nama: 'Empat Belas', emoji: '🐥' }, 15: { nama: 'Lima Belas', emoji: '🍬' },
            16: { nama: 'Enam Belas', emoji: '🐸' }, 17: { nama: 'Tujuh Belas', emoji: 'Sunflower' }, 18: { nama: 'Delapan Belas', emoji: '🦀' },
            19: { nama: 'Sembilan Belas', emoji: '🍕' }, 20: { nama: 'Dua Puluh', emoji: '🎁' }
        };

        // Ganti simbol matahari/bunga manual untuk kestabilan emoji 17
        databaseAngka[17].emoji = '🌻';

        let angkaAktif = 1;
        let nilaiBenar = 0;
        const gameEmojis = ['🍎', '🎈', '⭐', '🚗', '🍬', '🍩'];

        // Buat tombol angka 1-20
        const numberBox = document.getElementById('number-box');
        for (let i = 1; i <= 20; i++) {
            const btn = document.createElement('button');
            btn.className = `num-btn ${i === 1 ? 'active' : ''}`;
            btn.innerText = i;
            btn.id = `btn-num-${i}`;
            btn.onclick = () => gantiAngka(i);
            numberBox.appendChild(btn);
        }

        function gantiAngka(angka) {
            document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-num-${angka}`);
            if(activeBtn) activeBtn.classList.add('active');
            angkaAktif = angka;
            updateDisplay();
        }

        function updateDisplay() {
            const data = databaseAngka[angkaAktif];
            document.getElementById('view-number').innerText = angkaAktif;
            document.getElementById('view-name').innerText = data.nama;
            
            let kumpulanEmoji = '';
            for (let i = 0; i < angkaAktif; i++) { kumpulanEmoji += data.emoji; }
            document.getElementById('view-count').innerText = kumpulanEmoji;
        }

        function suaraAngka() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const data = databaseAngka[angkaAktif];
                const ucapan = new SpeechSynthesisUtterance(`${angkaAktif}... ${data.nama}`);
                ucapan.lang = 'id-ID';
                ucapan.rate = 0.8;
                window.speechSynthesis.speak(ucapan);
            }
        }

        // FUNGSI GAME BERHITUNG (+ dan -)
        function buatSoalBaru() {
            const tipeSoal = Math.random() > 0.5 ? '+' : '-';
            const emojiPilihan = gameEmojis[Math.floor(Math.random() * gameEmojis.length)];
            
            let n1, n2;

            if (tipeSoal === '+') {
                n1 = Math.floor(Math.random() * 10) + 1; // 1-10
                n2 = Math.floor(Math.random() * 10) + 1; // 1-10
                nilaiBenar = n1 + n2;
            } else {
                n1 = Math.floor(Math.random() * 15) + 5; // 5-20
                n2 = Math.floor(Math.random() * n1) + 1; // n2 tidak boleh lebih besar dari n1 biar tidak minus
                nilaiBenar = n1 - n2;
            }

            document.getElementById('num1').innerText = n1;
            document.getElementById('num2').innerText = n2;
            document.getElementById('math-op').innerText = tipeSoal;
            document.getElementById('jawaban-user').value = '';
            document.getElementById('game-feedback').innerText = '';

            // Tampilkan visualisasi emoji soal
            let txtEmoji1 = '', txtEmoji2 = '';
            for(let i=0; i<n1; i++) { txtEmoji1 += emojiPilihan; }
            for(let i=0; i<n2; i++) { txtEmoji2 += emojiPilihan; }
            
            document.getElementById('emoji1').innerText = txtEmoji1;
            document.getElementById('emoji2').innerText = txtEmoji2;
        }

        function cekJawaban() {
            const jawabanUser = parseInt(document.getElementById('jawaban-user').value);
            const feedback = document.getElementById('game-feedback');
            
            if (isNaN(jawabanUser)) {
                feedback.className = "feedback salah";
                feedback.innerText = "Isi dulu jawabannya, sayang! 😮";
                playSuaraTxt("Isi dulu jawabannya");
                return;
            }

            if (jawabanUser === nilaiBenar) {
                feedback.className = "feedback benar";
                feedback.innerText = "HEBAT! Jawabanmu BENAR! 🎉🥳";
                playSuaraTxt("Hebat! Jawabanmu benar!");
                setTimeout(buatSoalBaru, 3000); // Ganti soal otomatis setelah 3 detik
            } else {
                feedback.className = "feedback salah";
                feedback.innerText = "Yaaah, coba hitung lagi yuk! 💪😊";
                playSuaraTxt("Coba hitung lagi yuk");
            }
        }

        function playSuaraTxt(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const ucapan = new SpeechSynthesisUtterance(text);
                ucapan.lang = 'id-ID';
                ucapan.rate = 0.9;
                window.speechSynthesis.speak(ucapan);
            }
        }

        function toggleTheme() {
            const body = document.body;
            const theme = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', theme);
            localStorage.setItem('tk_theme', theme);
        }

        window.onload = () => {
            const savedTheme = localStorage.getItem('tk_theme');
            if (savedTheme) document.body.setAttribute('data-theme', savedTheme);
            updateDisplay();
            buatSoalBaru();
        };
    </script>
</body>
</html>
