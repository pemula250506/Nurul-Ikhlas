<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK Nurul Ikhlas - Mengenal Angka</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4A90E2;
            --green: #6BCB77;
            --yellow: #FFD93D;
            --bg: #F0FDF4; /* Hijau muda lembut */
            --text: #2C3E50;
        }

        * { box-sizing: border-box; font-family: 'Quicksand', sans-serif; }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-bottom: 5px solid var(--green);
        }

        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-ui { width: 40px; height: 40px; background: #E8F8EC; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 2px solid var(--green); font-size: 20px; }
        .brand h1 { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; color: var(--primary); margin: 0; }

        .nav-tabs { display: flex; gap: 8px; }
        .tab-btn { padding: 10px 18px; border: none; border-radius: 12px; background: transparent; font-weight: 700; text-decoration: none; color: var(--text); font-size: 0.9rem; }
        .tab-btn.active { background: var(--green); color: white; }

        main { flex: 1; padding: 40px 20px; max-width: 800px; margin: 0 auto; width: 100%; text-align: center; }

        .app-box {
            background: white;
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .star-display {
            font-size: 4rem;
            background: #F0FFF4;
            padding: 40px;
            border-radius: 25px;
            margin: 25px 0;
            min-width: 300px;
            letter-spacing: 10px;
            border: 3px dashed var(--green);
            min-height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .game-btn {
            background: var(--green);
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 1.3rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #4CAE5A;
            transition: 0.1s;
        }
        .game-btn:active { transform: translateY(6px); box-shadow: none; }

        .hint { font-size: 1.1rem; color: #7F8C8D; font-weight: 500; }

        footer { text-align: center; padding: 25px; color: #94A3B8; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="brand">
            <div class="logo-ui">🏫</div>
            <h1>TK Nurul Ikhlas</h1>
        </a>
        <nav class="nav-tabs">
            <a href="index.html" class="tab-btn">Beranda</a>
            <a href="membaca.html" class="tab-btn">Membaca</a>
            <a href="menghitung.html" class="tab-btn active">Angka</a>
            <a href="kreatif.html" class="tab-btn">Kreatif</a>
            <a href="profil.html" class="tab-btn">Profil</a>
        </nav>
    </header>

    <main>
        <h2 style="font-family: 'Fredoka'; color: var(--green); font-size: 2.2rem;">🔢 Mari Berhitung Bintang</h2>
        <p class="hint">Hitung jumlah bintang di bawah ini, lalu tebak angkanya!</p>

        <div class="app-box">
            <div id="area-bintang" class="star-display">⭐ ⭐ ⭐</div>
            <button class="game-btn" onclick="tebakAngka()">Tebak Angka 🎲</button>
        </div>
    </main>

    <footer>© 2026 TK Nurul Ikhlas - Dashboard Sekolah Anak</footer>

    <script>
        // Angka yang harus ditebak (awal 3)
        let angkaBenar = 3;

        function tebakAngka() {
            let jawaban = prompt("Ada berapa jumlah bintangnya? (Masukkan angka)");
            
            if (jawaban === null) return; // Jika klik cancel

            if (parseInt(jawaban) === angkaBenar) {
                alert("🎉 LUAR BIASA! Jawabanmu benar!");
                
                // Ganti ke angka acak baru (1 sampai 6)
                angkaBenar = Math.floor(Math.random() * 6) + 1;
                
                // Tampilkan bintang baru di layar
                const area = document.getElementById('area-bintang');
                area.innerText = ""; // Bersihkan dulu
                for(let i = 0; i < angkaBenar; i++) {
                    area.innerText += "⭐ ";
                }
            } else {
                alert("❌ Hmm, coba hitung lagi pelan-pelan ya!");
            }
        }
    </script>
</body>
</html>
