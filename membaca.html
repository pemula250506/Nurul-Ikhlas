<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK Nurul Ikhlas - Mari Membaca</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        /* Desain Tambahan Khusus Halaman Membaca */
        .sub-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn-sub {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            background: #E2E8F0;
            color: #334155;
        }

        .btn-sub.active {
            background: #FF85A1;
            color: white;
            box-shadow: 0 4px 12px rgba(255, 133, 161, 0.3);
        }

        .sub-page {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .sub-page.active {
            display: block;
        }

        /* Desain Konten Buah-Buahan */
        .buah-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .buah-emoji {
            font-size: 7rem;
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.1));
            animation: bounce 2s infinite;
        }

        .ejaan {
            font-size: 2.5rem;
            font-family: 'Fredoka', sans-serif;
            letter-spacing: 2px;
            color: #334155;
        }

        .ejaan span {
            color: #FF85A1;
            border-bottom: 4px rounded #FF85A1;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand" onclick="window.location.href='index.html'">
            <div class="logo-container">
                <img src="ChatGPT_Image_18_Mei_2026__18.53.23-removebg-preview.png" alt="🏫">
            </div>
            <h1 class="brand-title">TK Nurul Ikhlas</h1>
        </div>
        <nav class="nav-menu">
            <button class="nav-btn" onclick="window.location.href='index.html'">🏠 Kembali ke Beranda</button>
        </nav>
    </header>

    <main>
        <div class="app-box">
            <h2 style="color: #FF85A1; font-size: 2rem; margin-bottom: 10px;">📖 Kelas Membaca</h2>
            <p style="color: #64748B; margin-bottom: 25px;">Pilih aktivitas belajar seru di bawah ini ya!</p>

            <div class="sub-nav">
                <button class="btn-sub active" id="btn-huruf" onclick="pindahSubHalaman('huruf')">🔤 Mengenal Huruf</button>
                <button class="btn-sub" id="btn-buah" onclick="pindahSubHalaman('buah')">🍎 Membaca Buah</button>
            </div>

            <div id="sub-huruf" class="sub-page active">
                <p>Yuk, sebutkan huruf besar dan huruf kecil ini!</p>
                <div class="flashcard" id="letter-card" style="font-size: 6rem; padding: 30px 60px;">A a</div>
                <br><br>
                <button class="game-btn" style="background: #FF85A1; box-shadow: 0 5px 0 #D65A76;" onclick="gantiHuruf()">Huruf Selanjutnya ✨</button>
            </div>

            <div id="sub-buah" class="sub-page">
                <p>Ikuti gurumu mengeja nama buah segar ini!</p>
                
                <div class="buah-box">
                    <div class="buah-emoji" id="buah-pic">🍎</div>
                    <div class="ejaan" id="buah-text">A - P - E - L</div>
                </div>
                
                <br><br>
                <button class="game-btn" style="background: #6BCB77; box-shadow: 0 5px 0 #4CAE5A;" onclick="gantiBuah()">Buah Selanjutnya 🍉</button>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 TK Nurul Ikhlas - Modul Membaca Pintar</p>
    </footer>

    <script>
        // --- 1. Fungsi Navigasi Tab Intern ---
        function pindahSubHalaman(kategori) {
            // Sembunyikan semua sub-halaman
            document.querySelectorAll('.sub-page').forEach(page => page.classList.remove('active'));
            // Hapus status aktif tombol
            document.querySelectorAll('.btn-sub').forEach(btn => btn.classList.remove('active'));

            // Aktifkan pilihan
            document.getElementById('sub-' + kategori).classList.add('active');
            document.getElementById('btn-' + kategori).classList.add('active');
        }
