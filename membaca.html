<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK Nurul Ikhlas - Mari Membaca</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4A90E2;
            --pink: #FF85A1;
            --yellow: #FFD93D;
            --bg: #F0F9FF;
            --text: #2C3E50;
        }

        * { box-sizing: border-box; font-family: 'Quicksand', sans-serif; }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-bottom: 5px solid var(--pink);
        }

        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-ui { width: 40px; height: 40px; background: var(--bg); border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 2px solid var(--pink); }
        .brand h1 { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; color: var(--primary); margin: 0; }

        .nav-tabs { display: flex; gap: 8px; }
        .tab-btn { padding: 10px 18px; border: none; border-radius: 12px; background: transparent; font-weight: 700; text-decoration: none; color: var(--text); font-size: 0.9rem; }
        .tab-btn.active { background: var(--pink); color: white; }

        main { flex: 1; padding: 40px 20px; max-width: 800px; margin: 0 auto; width: 100%; text-align: center; }

        /* OPSI PEMILIHAN */
        .option-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .opt-btn {
            padding: 12px 25px;
            border: 3px solid var(--pink);
            border-radius: 20px;
            background: white;
            color: var(--pink);
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .opt-btn.active { background: var(--pink); color: white; }

        /* DISPLAY AREA */
        .app-box {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .display-content { display: none; animation: fadeIn 0.5s ease; }
        .display-content.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .flashcard {
            font-size: 5rem;
            background: #FFF5F7;
            color: var(--pink);
            padding: 40px;
            border-radius: 25px;
            margin-bottom: 25px;
            min-width: 250px;
            box-shadow: inset 0 -6px 0 rgba(0,0,0,0.1);
        }

        .fruit-img { font-size: 6rem; display: block; margin-bottom: 10px; }
        .fruit-name { font-family: 'Fredoka'; font-size: 3rem; color: #E11D48; letter-spacing: 5px; }

        .game-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #357ABD;
        }
        .game-btn:active { transform: translateY(5px); box-shadow: none; }

        footer { text-align: center; padding: 20px; color: #94A3B8; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="brand">
            <div class="logo-ui">🏫</div>
            <h1>TK Nurul Ikhlas</h1>
        </a>
        <nav class="nav-tabs">
            <a href="index.html" class="tab-btn">Beranda</a>
            <a href="membaca.html" class="tab-btn active">Membaca</a>
            <a href="menghitung.html" class="tab-btn">Angka</a>
            <a href="kreatif.html" class="tab-btn">Kreatif</a>
            <a href="profil.html" class="tab-btn">Profil</a>
        </nav>
    </header>

    <main>
        <h2 style="font-family: 'Fredoka'; color: var(--pink);">📖 Mari Belajar Membaca</h2>
        
        <div class="option-container">
            <button id="btn-huruf" class="opt-btn active" onclick="pilihMode('huruf')">🔤 Mengenal Huruf</button>
            <button id="btn-buah" class="opt-btn" onclick="pilihMode('buah')">🍎 Nama Buah-Buahan</button>
        </div>

        <div class="app-box">
            <!-- MODE HURUF -->
            <div id="mode-huruf" class="display-content active">
                <p>Sebutkan huruf ini dengan nyaring!</p>
                <div class="flashcard" id="txt-huruf">A a</div>
                <button class="game-btn" onclick="acakHuruf()">Huruf Selanjutnya ✨</button>
            </div>

            <!-- MODE BUAH -->
            <div id="mode-buah" class="display-content">
                <p>Ayo mengeja nama buah ini!</p>
                <div class="flashcard" style="background: #FFFDE7;">
                    <span id="img-buah" class="fruit-img">🍎</span>
                    <span id="txt-buah" class="fruit-name">A P E L</span>
                </div>
                <button class="game-btn" style="background: #6BCB77; box-shadow: 0 5px 0 #4CAE5A;" onclick="acakBuah()">Buah Selanjutnya 🍏</button>
            </div>
        </div>
    </main>

    <footer>© 2026 TK Nurul Ikhlas</footer>

    <script>
        // FUNGSI GANTI MODE
        function pilihMode(mode) {
            document.getElementById('mode-huruf').classList.remove('active');
            document.getElementById('mode-buah').classList.remove('active');
            document.getElementById('btn-huruf').classList.remove('active');
            document.getElementById('btn-buah').classList.remove('active');

            if(mode === 'huruf') {
                document.getElementById('mode-huruf').classList.add('active');
                document.getElementById('btn-huruf').classList.add('active');
            } else {
                document.getElementById('mode-buah').classList.add('active');
                document.getElementById('btn-buah').classList.add('active');
            }
        }

        // LOGIKA HURUF
        const daftarHuruf = ['A a','B b','C c','D d','E e','F f','G g','H h','I i','J j','K k','L l','M m','N n','O o','P p','Q q','R r','S s','T t','U u','V v','W w','X x','Y y','Z z'];
        function acakHuruf() {
            const h = daftarHuruf[Math.floor(Math.random() * daftarHuruf.length)];
            document.getElementById('txt-huruf').innerText = h;
        }

        // LOGIKA BUAH
        const daftarBuah = [
            {n: "A P E L", i: "🍎"}, {n: "P I S A N G", i: "🍌"},
            {n: "J E R U K", i: "🍊"}, {n: "M A N G G A", i: "🥭"},
            {n: "A N G G U R", i: "🍇"}, {n: "S E M A N G K A", i: "🍉"}
        ];
        function acakBuah() {
            const b = daftarBuah[Math.floor(Math.random() * daftarBuah.length)];
            document.getElementById('img-buah').innerText = b.i;
            document.getElementById('txt-buah').innerText = b.n;
        }
    </script>
</body>
</html>
